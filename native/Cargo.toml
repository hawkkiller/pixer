[package]
name = "pixer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
libc = "0.2.177"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = "0.25.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
image = { version = "0.25.5", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
