language = "C"
include_guard = "FAST_IMAGE_H"
style = "both"
cpp_compat = true

[export]
exclude = ["pixer_alloc", "pixer_dealloc"]
# Not reachable from any function signature, but needed by the Dart side.
include = ["ImageFormatEnum", "FilterTypeEnum", "PixerOperationKind", "PixelLayout"]

[parse]
parse_deps = false
