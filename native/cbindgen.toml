language = "C"
include_guard = "FAST_IMAGE_H"
style = "both"
cpp_compat = true

[export]
exclude = ["pixer_alloc", "pixer_dealloc"]
include = [
  "ImageHandle",
  "ImageResult",
  "ImageErrorCode",
  "ImageFormatEnum",
  "FilterTypeEnum",
  "ImageMetadata",
  "PixerOperation",
  "PixerOperationKind",
]

[parse]
parse_deps = false
