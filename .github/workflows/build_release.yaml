# A workflow for building and releasing prebuilt native assets for pixer
name: pixer_prebuild_assets

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build_release.yaml
      - native/**
      - packages/pixer/**
      - pubspec.yaml
  push:
    tags:
      - "pixer-assets*"
  workflow_dispatch:

jobs:
  # Fails a release tag in seconds instead of after the full build matrix.
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pixer/
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Check release versions
        if: startsWith(github.ref, 'refs/tags/pixer-assets-v')
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF_NAME" = "pixer-assets-v$version" ] \
            || fail "Tag $GITHUB_REF_NAME does not match pubspec version $version"
          grep -qx "const version = '$GITHUB_REF_NAME';" lib/src/hook/version.dart \
            || fail "lib/src/hook/version.dart does not point at $GITHUB_REF_NAME"
          grep -qx "## $version" CHANGELOG.md \
            || fail "CHANGELOG.md has no '## $version' section"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "Release tags must point at a commit on main"

  rust:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      # Provides rustup; checks use the toolchain pinned in native/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # A reduced format set must still compile without warnings.
      - run: cargo clippy --no-default-features --features png -- -D warnings
      - run: cargo test

  wasm:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pixer/
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c
        with:
          sdk: stable
      # Provides rustup; builds use the toolchain and targets pinned in native/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - run: dart tool/build_wasm.dart libs/pixer.wasm
      - run: cp libs/pixer.wasm test/pixer.wasm
      - run: dart test -p chrome test/pixer_test.dart test/pixer_wasm_test.dart
      - run: dart test -p chrome --compiler dart2wasm test/pixer_test.dart test/pixer_wasm_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm
          path: packages/pixer/libs/pixer.wasm
          if-no-files-found: error

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]

    runs-on: ${{ matrix.os }}-latest

    defaults:
      run:
        working-directory: packages/pixer/

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c
        with:
          sdk: stable

      # Provides rustup; builds use the toolchain and targets pinned in native/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable

      - uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r27
        if: ${{ matrix.os == 'ubuntu' }} # Only build on one host.

      - name: Install native toolchains
        run: sudo apt-get update && sudo apt-get install clang-15 gcc-aarch64-linux-gnu
        if: ${{ matrix.os == 'ubuntu' }}

      - run: dart pub get

      # Builds the host library through the workspace's local_build hook.
      - run: dart test test/pixer_test.dart test/pixer_file_test.dart

      - run: mkdir libs

      # Keep this list consistent with packages/pixer/lib/src/hook/target_versions.dart
      - name: Build Linux host
        if: matrix.os == 'ubuntu'
        run: |
          # dart tool/build.dart -oandroid -aia32
          # dart tool/build.dart -oandroid -ariscv64
          # dart tool/build.dart -olinux -aarm
          # dart tool/build.dart -olinux -aia32
          # dart tool/build.dart -olinux -ariscv64

          dart tool/build.dart -oandroid -aarm
          dart tool/build.dart -oandroid -aarm64
          dart tool/build.dart -oandroid -ax64
          dart tool/build.dart -olinux -aarm64
          dart tool/build.dart -olinux -ax64

          mv .dart_tool/pixer/shared/**/target/armv7-linux-androideabi/release/libpixer.so libs/libpixer_android_armv7.so
          mv .dart_tool/pixer/shared/**/target/aarch64-linux-android/release/libpixer.so libs/libpixer_android_arm64.so
          mv .dart_tool/pixer/shared/**/target/x86_64-linux-android/release/libpixer.so libs/libpixer_android_x86_64.so
          mv .dart_tool/pixer/shared/**/target/aarch64-unknown-linux-gnu/release/libpixer.so libs/libpixer_linux_aarch64.so
          mv .dart_tool/pixer/shared/**/target/x86_64-unknown-linux-gnu/release/libpixer.so libs/libpixer_linux_x86_64.so

      - name: Build MacOS host
        if: matrix.os == 'macos'
        run: |
          dart tool/build.dart -omacos -aarm64
          dart tool/build.dart -omacos -ax64
          dart tool/build.dart -oios -iiphoneos -aarm64
          dart tool/build.dart -oios -iiphonesimulator -aarm64
          dart tool/build.dart -oios -iiphonesimulator -ax64

          mv .dart_tool/pixer/shared/**/target/aarch64-apple-darwin/release/libpixer.dylib libs/libpixer_macos_arm64.dylib
          mv .dart_tool/pixer/shared/**/target/x86_64-apple-darwin/release/libpixer.dylib libs/libpixer_macos_x86_64.dylib
          mv .dart_tool/pixer/shared/**/target/aarch64-apple-ios/release/libpixer.dylib libs/libpixer_ios_arm64.dylib
          mv .dart_tool/pixer/shared/**/target/aarch64-apple-ios-sim/release/libpixer.dylib libs/libpixer_ios_sim_arm64.dylib
          mv .dart_tool/pixer/shared/**/target/x86_64-apple-ios/release/libpixer.dylib libs/libpixer_ios_sim_x86_64.dylib

      - name: Build Windows host
        if: matrix.os == 'windows'
        run: |
          dart tool/build.dart -owindows -aarm64
          dart tool/build.dart -owindows -ax64

          mv .dart_tool/pixer/shared/**/target/aarch64-pc-windows-msvc/release/pixer.dll libs/pixer_windows_arm64.dll
          mv .dart_tool/pixer/shared/**/target/x86_64-pc-windows-msvc/release/pixer.dll libs/pixer_windows_x86_64.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.os }}-host
          path: packages/pixer/libs/
          if-no-files-found: error

  release:
    needs: [rust, build, wasm]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/pixer/

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: true

      - name: Download assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          merge-multiple: true
          path: packages/pixer/libs/

      - name: Display structure of downloaded assets
        run: ls -R libs/

      - name: Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836
        if: startsWith(github.ref, 'refs/tags/pixer')
        with:
          files: "packages/pixer/libs/**"
          fail_on_unmatched_files: true

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/pixer-assets-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the regenerated hashes to main
      id-token: write # pub.dev automated publishing

    defaults:
      run:
        working-directory: packages/pixer/

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c
        with:
          sdk: stable

      - run: dart pub get

      # Downloads every asset from the release above, so a missing upload fails before publishing.
      - run: dart tool/generate_asset_hashes.dart

      - name: Commit asset hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/hook/hashes.dart
          git diff --cached --quiet || git commit -m "release: update ${GITHUB_REF_NAME#pixer-assets-v} asset hashes"

      # Publishes the tagged tree plus the new hashes. Skipped on re-runs after a successful publish.
      - name: Publish to pub.dev
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          if curl -sf "https://pub.dev/api/packages/pixer/versions/$version" > /dev/null; then
            echo "pixer $version is already on pub.dev"
          else
            dart pub publish --force
          fi

      - name: Push asset hashes to main
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
